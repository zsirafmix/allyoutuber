services:
  - type: web
    name: allyoutuber
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: allyoutuber-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false

databases:
  - name: allyoutuber-db
    databaseName: allyoutuber
    user: allyoutuber_user
    plan: free
    region: frankfurt
